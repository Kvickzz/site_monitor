services:
  db:
    image: postgres:15-alpine
    container_name: site_monitor_db
    environment:
      POSTGRES_DB: site_monitor
      POSTGRES_USER: site_monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: site_monitor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  web:
    build: .
    container_name: site_monitor_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgresql://site_monitor:${DB_PASSWORD}@db:5432/site_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  celery:
    build: .
    container_name: site_monitor_celery
    command: celery -A config worker -l info --pool=eventlet --concurrency=500
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
    environment:
      DEBUG: 'False'
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgresql://site_monitor:${DB_PASSWORD}@db:5432/site_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - db
      - redis
      - web
    networks:
      - app-network

  celery-beat:
    build: .
    container_name: site_monitor_celery_beat
    command: celery -A config beat -l info
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
    environment:
      DEBUG: 'False'
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgresql://site_monitor:${DB_PASSWORD}@db:5432/site_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - db
      - redis
      - web
    networks:
      - app-network
  mailpit:
    image: axllent/mailpit
    container_name: site_monitor_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
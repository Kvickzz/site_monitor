<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Site Monitor{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #1d1d22;
            --surface: #29292e;
            --surface-alt: #232327;
            --border: #3a3a40;
            --accent: #912828;
            --accent-hover: #af2828;
            --text: #ffffff;
            --text-muted: #9a9aa0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { 
            color: var(--accent-hover); 
            text-decoration: none;
        }
        a:hover { color: #d43a3a; }

        /* Navbar */
        .navbar {
            background-color: var(--surface) !important;
            box-shadow: 0 2px 8px rgba(0,0,0,.3);
        }

        /* Cards */
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.25);
            color: var(--text);
        }
        .card-header {
            background-color: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }
        .card-footer {
            background-color: transparent;
            border-top: 1px solid var(--border);
        }

        /* Text helpers stay readable on dark bg */
        .text-muted { color: var(--text-muted) !important; }

        /* Tables */
        .table {
            color: var(--text);
            border-color: var(--border);
        }
        .table > :not(caption) > * > * {
            background-color: transparent;
            color: var(--text);
            border-bottom-color: var(--border);
        }
        .table-hover > tbody > tr:hover > * {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text);
        }

        /* Forms */
        .form-control, .form-select {
            background-color: rgb(65, 76, 112);
            border: 1px solid rgb(94, 94, 95);
            color: white;
            border-radius: 4px;
        }
        .form-control:focus, .form-select:focus {
            background-color: rgb(65, 76, 112);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(145, 40, 40, 0.25);
            outline: none;
        }
        .form-control::placeholder { color: #d5d8e5; }
        .form-check-input {
            background-color: var(--surface-alt);
            border: 1px solid var(--border);
        }
        .form-check-input:checked {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .form-text { color: var(--text-muted); }
        .invalid-feedback { color: #ff8080; }

        /* Buttons */
        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-secondary {
            background-color: #46464d;
            border-color: #46464d;
        }
        .btn-secondary:hover {
            background-color: #57575f;
            border-color: #57575f;
        }
        .btn-outline-primary {
            color: var(--accent-hover);
            border-color: var(--accent);
        }
        .btn-outline-primary:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .btn-danger {
            background-color: #b02a37;
            border-color: #b02a37;
        }
        .btn-danger:hover {
            background-color: #c93a48;
            border-color: #c93a48;
        }

        /* Badges: Website status */
        .badge-up { background-color: #28a745; }
        .badge-down { background-color: #dc3545; }
        .badge-slow { background-color: #ffc107; color: #1d1d22; }
        .badge-unknown { background-color: #6c757d; }

        /* Badges: HealthCheck status (fixes missing classes) */
        .badge-success { background-color: #28a745; }
        .badge-timeout { background-color: #ffc107; color: #1d1d22; }
        .badge-error { background-color: #dc3545; }
        .badge-ssl_error { background-color: #dc3545; }
        .badge-connection_error { background-color: #dc3545; }

        /* Alerts: general bootstrap tags */
        .alert { border: 1px solid transparent; }
        .alert-success { background-color: rgba(40,167,69,.15); color: #6ee7b7; border-color: rgba(40,167,69,.35); }
        .alert-danger  { background-color: rgba(220,53,69,.15); color: #fca5a5; border-color: rgba(220,53,69,.35); }
        .alert-warning { background-color: rgba(255,193,7,.15); color: #ffe08a; border-color: rgba(255,193,7,.35); }
        .alert-info    { background-color: rgba(13,202,240,.15); color: #7fdcf4; border-color: rgba(13,202,240,.35); }

        /* Alerts: Alert.alert_type (fixes missing classes) */
        .alert-up   { background-color: rgba(40,167,69,.15); color: #6ee7b7; border-color: rgba(40,167,69,.35); }
        .alert-down { background-color: rgba(220,53,69,.15); color: #fca5a5; border-color: rgba(220,53,69,.35); }
        .alert-slow { background-color: rgba(255,193,7,.15); color: #ffe08a; border-color: rgba(255,193,7,.35); }
        .alert-ssl_error { background-color: rgba(220,53,69,.15); color: #fca5a5; border-color: rgba(220,53,69,.35); }

        .status-indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        /* Progress bars */
        .progress {
            background-color: var(--surface-alt);
        }

        /* Dropdown */
        .dropdown-menu {
            background-color: var(--surface);
            border: 1px solid var(--border);
        }
        .dropdown-item {
            color: var(--text);
        }
        .dropdown-item:hover, .dropdown-item:focus {
            background-color: var(--surface-alt);
            color: var(--text);
        }
        .dropdown-divider { border-color: var(--border); }

        .container.mt-4 {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
            background-color: var(--surface) !important;
            border-top: 1px solid var(--border) !important;
            color: var(--text-muted);
        }
        footer a {
        color: #9a9aa0;
        transition: color 0.3s ease;
        }   
        footer a:hover {
            color: #ffffff;
        }

        hr { border-color: var(--border); opacity: 1; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'includes/navbar.html' %}

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
